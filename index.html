<title>UPG Command Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: leadership console — left rail, sticky header + filter bar, 12-col content grid; phone gets bottom tabs and sheets */
:root{
  --brand:#EB078E; --brand-ink:#B5006B; --brand-soft:#FCE6F2; --brand-line:#F6B9DA;
  --bg:#F5F3F6; --surface:#FFFFFF; --surface-2:#FAF8FB; --sunk:#EFEBF1;
  --ink:#1D1820; --muted:#645C69; --faint:#8E8693; --line:#E6E1E9; --line-2:#D8D1DC;
  --good:#1E9E5A; --warn:#C98500; --bad:#D63C3C; --info:#2F6FDE;
  --good-bg:#E4F4EB; --warn-bg:#FFF2D4; --bad-bg:#FCE5E5; --info-bg:#E6EEFC;
  --map-none:#ECE8EE; --map-edge:#FFFFFF;
  --shadow:0 1px 2px rgba(40,10,30,.06),0 4px 16px rgba(40,10,30,.05);
  --f-ui:'Manrope','Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-bn:'Hind Siliguri','Manrope',system-ui,sans-serif;
  --r:10px; --r-sm:7px;
}
/* Light (white) is the primary theme; dark is opt-in via the header toggle */
:root[data-theme="dark"]{
  --brand:#FF3DA6; --brand-ink:#FF7CC2; --brand-soft:#3B1430; --brand-line:#6E2257;
  --bg:#121014; --surface:#1B181E; --surface-2:#211D25; --sunk:#16131A;
  --ink:#EFEAF1; --muted:#ABA1B0; --faint:#7F7684; --line:#2E2933; --line-2:#3C3542;
  --good:#3CC57F; --warn:#F0B23C; --bad:#F06767; --info:#6E9DFF;
  --good-bg:#12301F; --warn-bg:#33270C; --bad-bg:#3A1818; --info-bg:#16233F;
  --map-none:#26222A; --map-edge:#121014; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
html[lang="bn"] body{font-family:var(--f-bn);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.num,table,.kpi-v{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--brand-ink)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- app frame ---------- */
#app{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100%}
#app.rail-min{grid-template-columns:68px minmax(0,1fr)}
header.top{grid-column:1/-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:14px;padding:8px 18px;background:var(--surface);border-bottom:1px solid var(--line);min-height:58px}
.brandmark{display:flex;align-items:center;gap:12px;min-width:0}
.brandmark img{height:30px;width:auto;display:block}
.brandmark .prod{display:flex;flex-direction:column;line-height:1.1;border-left:1px solid var(--line);padding-left:12px;min-width:0}
.brandmark .prod b{font-size:15px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.brandmark .prod span{font-size:11px;color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.top .spacer{flex:1}
.search{position:relative;flex:0 1 340px;min-width:0}
.search input{width:100%;height:36px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:0 14px 0 34px;outline:none}
.search input:focus{border-color:var(--brand-line);background:var(--surface)}
.search svg{position:absolute;left:12px;top:10px;width:16px;height:16px;color:var(--faint)}
.search .results{position:absolute;top:42px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:60}
.search .results button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:9px 12px;border-bottom:1px solid var(--line)}
.search .results button:hover,.search .results button:focus{background:var(--surface-2)}
.search .results small{color:var(--muted);margin-left:auto;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.iconbtn{height:36px;min-width:36px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 10px;position:relative;color:var(--ink)}
.iconbtn:hover{border-color:var(--line-2);background:var(--surface-2)}
.iconbtn svg{width:17px;height:17px}
.iconbtn .dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:none;padding:6px 11px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.user{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;background:var(--surface)}
.user .av{width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.user select{border:0;background:none;font-weight:600;font-size:12px;max-width:190px;outline:none}

nav.rail{grid-row:2;position:sticky;top:58px;align-self:start;height:calc(100vh - 58px);overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px}
nav.rail .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);padding:12px 10px 4px;font-weight:700}
nav.rail button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;color:var(--muted);font-weight:600;white-space:nowrap}
nav.rail button svg{width:18px;height:18px;flex:none}
nav.rail button:hover{background:var(--surface-2);color:var(--ink)}
nav.rail button[aria-current="page"]{background:var(--brand-soft);color:var(--brand-ink)}
nav.rail button .cnt{margin-left:auto;font-size:11px;background:var(--bad-bg);color:var(--bad);border-radius:9px;padding:1px 7px;font-weight:700}
nav.rail .collapse{margin-top:auto}
#app.rail-min nav.rail .lbl,#app.rail-min nav.rail .grp,#app.rail-min nav.rail .cnt{display:none}
main{grid-row:2;min-width:0;display:flex;flex-direction:column}

/* filter bar */
.fbar{position:sticky;top:58px;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px;font-weight:700;min-width:0}
.crumbs button{border:0;background:none;padding:4px 6px;border-radius:6px;color:var(--muted);font-weight:700}
.crumbs button:hover{background:var(--surface);color:var(--ink)}
.crumbs button[aria-current="true"]{color:var(--ink)}
.crumbs .sep{color:var(--faint)}
.crumbs .lvl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--brand-ink);background:var(--brand-soft);border-radius:4px;padding:1px 5px;margin-left:4px}
.fsel{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.fsel label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
select.ctl,input.ctl{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px;font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink);max-width:100%}
.btn{height:34px;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 13px;font-weight:700;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn svg{width:15px;height:15px}
.mfilter{display:none}

/* content */
.content{padding:20px 22px 40px;display:flex;flex-direction:column;gap:18px;max-width:1680px;width:100%;margin:0 auto}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;justify-content:space-between}
.pagehead h1{font-size:23px;font-weight:800}
.pagehead p{margin:3px 0 0;color:var(--muted);max-width:70ch}
.fresh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.fresh i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-bg)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:14.5px;font-weight:800}
.card .sub{font-size:12px;color:var(--muted);margin-top:-6px}
.card-h{display:flex;align-items:flex-start;gap:10px;justify-content:space-between;flex-wrap:wrap}
.insight{display:flex;gap:9px;align-items:flex-start;margin:0;font-size:12.8px;color:var(--ink);background:var(--surface-2);border:1px dashed var(--line-2);border-radius:8px;padding:8px 10px}
.insight .ai{flex:none;font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--brand-ink);background:var(--brand-soft);border-radius:4px;padding:2px 5px;margin-top:1px}
.chart{width:100%;height:260px;min-width:0}
.chart.tall{height:340px}.chart.short{height:200px}.chart.xs{height:150px}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px 10px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;cursor:pointer;transition:border-color .15s, box-shadow .15s}
.kpi:hover{border-color:var(--brand-line);box-shadow:var(--shadow)}
.kpi .lab{display:flex;align-items:flex-start;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em;min-height:31px;line-height:1.3}
.kpi .lab .rag{margin-top:3px}
.kpi .lab .tip{margin-left:auto}
.kpi .kpi-v{font-size:clamp(19px,1.55vw,25px);font-weight:800;letter-spacing:-.02em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.kpi .spark{height:34px;margin-top:2px}
.rag{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.rag.g{background:var(--good)}.rag.a{background:var(--warn)}.rag.r{background:var(--bad)}
.ragtxt{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.ragtxt.g{color:var(--good)}.ragtxt.a{color:var(--warn)}.ragtxt.r{color:var(--bad)}
.dl{display:inline-flex;align-items:center;gap:2px;font-weight:800}
.dl.up{color:var(--good)}.dl.down{color:var(--bad)}.dl.flat{color:var(--muted)}
.tip{position:relative;display:inline-flex;width:16px;height:16px;border-radius:50%;border:1px solid var(--line-2);align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--muted);background:var(--surface);flex:none;cursor:help}
.tip .tt{display:none;position:absolute;right:-6px;top:22px;width:270px;background:var(--ink);color:var(--surface);font-weight:500;font-size:11.5px;line-height:1.45;padding:9px 11px;border-radius:8px;z-index:50;text-align:left;text-transform:none;letter-spacing:0;white-space:normal}
.tip:hover .tt,.tip:focus .tt{display:block}
.tt b{display:block;margin-bottom:3px}
.tt em{display:block;margin-top:5px;opacity:.75;font-style:normal}

/* brief */
.brief{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden}
.brief .lead{padding:18px 20px;display:flex;flex-direction:column;gap:10px;border-right:1px solid var(--line);background:linear-gradient(180deg,var(--brand-soft),var(--surface) 70%)}
.brief .eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-ink);display:flex;gap:8px;align-items:center}
.brief h2{font-size:19px;font-weight:800;line-height:1.3}
.brief ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.brief li{display:flex;gap:9px;align-items:flex-start;font-size:13px}
.brief .acts{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.brief .acts h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.act{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.act .n{width:22px;height:22px;border-radius:6px;background:var(--brand);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* lists, tables, chips */
.tbl-wrap{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:8px}
table.t{width:100%;border-collapse:collapse;font-size:12.8px}
table.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.t th.r,table.t td.r{text-align:right}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover td{background:var(--surface-2)}
table.t tr.click{cursor:pointer}
table.t td .bar{display:inline-block;height:6px;border-radius:3px;background:var(--brand);vertical-align:middle;margin-right:6px;opacity:.75}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip.g{background:var(--good-bg);color:var(--good)}.chip.a{background:var(--warn-bg);color:var(--warn)}.chip.r{background:var(--bad-bg);color:var(--bad)}.chip.i{background:var(--info-bg);color:var(--info)}.chip.n{background:var(--sunk);color:var(--muted)}.chip.b{background:var(--brand-soft);color:var(--brand-ink)}
.linkbtn{border:0;background:none;padding:0;color:var(--brand-ink);font-weight:700;text-align:left}
.linkbtn:hover{text-decoration:underline}
.muted{color:var(--muted)}.small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini>div{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.mini b{display:block;font-size:17px;font-weight:800}
.mini span{font-size:11px;color:var(--muted);font-weight:700}

/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:16px;align-items:start}
.mapcard{padding:0;overflow:hidden;position:relative}
.maptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
#bdmap{height:min(72vh,720px);min-height:420px;width:100%}
.legendnote{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}

/* alerts */
.alert{display:grid;grid-template-columns:4px minmax(0,1fr);border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.alert .stripe.High{background:var(--bad)}.alert .stripe.Medium{background:var(--warn)}.alert .stripe.Low{background:var(--info)}
.alert .body{padding:11px 13px;display:flex;flex-direction:column;gap:7px;min-width:0}
.alert .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted);align-items:center}
.alert .ttl{font-weight:700}
.alert .ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.alert details{font-size:12px}
.alert textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);padding:6px 8px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,8,14,.38);z-index:80}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:90;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.wide{width:min(760px,100%)}
.drawer .dh{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer .dh h2{font-size:18px;font-weight:800}
.drawer .dh .x{margin-left:auto}
.drawer .db{overflow:auto;padding:16px 18px 30px;display:flex;flex-direction:column;gap:14px}
.timeline{display:grid;grid-template-columns:repeat(25,minmax(0,1fr));gap:2px}
.timeline div{height:26px;border-radius:3px;background:var(--sunk);position:relative}
.timeline div.done{background:var(--brand-line)}
.timeline div.now{background:var(--brand);}
.timeline div.ev::after{content:'';position:absolute;left:50%;top:-5px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ink)}
.tl-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.check{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.check .ic{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.check .ic.ok{background:var(--good-bg);color:var(--good)}.check .ic.no{background:var(--bad-bg);color:var(--bad)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}

/* ask */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:100%;display:flex;flex-direction:column;gap:8px}
.msg.q{align-self:flex-end;background:var(--brand);color:#fff;border-radius:14px 14px 4px 14px;padding:9px 13px;max-width:85%}
.msg.a{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:12px 14px}
.msg.a .why{font-size:11.5px;color:var(--muted)}
.askbar{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding-top:6px}
.askbar input{flex:1;min-width:0;height:42px;border:1px solid var(--line-2);border-radius:999px;padding:0 16px;background:var(--surface)}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sugs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted);text-align:left}
.sugs button:hover{border-color:var(--brand-line);color:var(--brand-ink)}

/* forms & settings */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--brand-ink);border-color:var(--brand)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
.field input[type=range]{accent-color:var(--brand)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink)}
.toggle input{accent-color:var(--brand);width:16px;height:16px}
.ro input,.ro select{pointer-events:none;opacity:.6}
.qa td.pass{color:var(--good);font-weight:800}.qa td.fail{color:var(--bad);font-weight:800}

/* tour, toast, footer */
.tour{position:fixed;z-index:120;max-width:320px;background:var(--ink);color:var(--surface);border-radius:12px;padding:14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:8px;font-size:13px}
.tour b{font-size:14px}
.tour .row button{border:0;border-radius:7px;padding:6px 11px;font-weight:700}
.tour .row .nx{background:var(--brand);color:#fff}.tour .row .sk{background:transparent;color:inherit;opacity:.8}
.tour-hl{position:fixed;z-index:110;border:2px solid var(--brand);border-radius:12px;box-shadow:0 0 0 9999px rgba(15,8,14,.45);pointer-events:none;transition:all .2s}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-weight:700;font-size:13px;z-index:130;box-shadow:var(--shadow)}
footer.demo{padding:14px 22px 26px;font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;border-top:1px solid var(--line)}
footer.demo b{color:var(--bad);letter-spacing:.04em}
.boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:200;color:var(--muted);font-weight:700;padding:16px;text-align:center}
.boot img{height:46px}
.boot .bar{width:220px;max-width:70vw;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.boot .bar i{display:block;height:100%;width:40%;background:var(--brand);animation:slide 1.1s infinite ease-in-out}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.skel{background:linear-gradient(90deg,var(--sunk),var(--surface-2),var(--sunk));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:10px}
.tabbar{display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:16px 16px 0 0;z-index:95;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:80vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet .grab{width:44px;height:4px;border-radius:2px;background:var(--line-2);align-self:center}
.sheet .navgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sheet .navgrid button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px;font-weight:700;text-align:left}
.sheet .navgrid svg{width:18px;height:18px;color:var(--brand-ink)}
.srOnly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* responsive */
@media (max-width:1400px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1279px){
  #app{grid-template-columns:68px minmax(0,1fr)}
  nav.rail .lbl,nav.rail .grp,nav.rail .cnt,nav.rail .collapse{display:none}
  .c8,.c7,.c6,.c5,.c4{grid-column:span 6}.c3{grid-column:span 6}
  .mapwrap{grid-template-columns:minmax(0,1fr)}
  .brandmark .prod span{display:none}
  .search{flex-basis:220px}
}
@media (max-width:900px){.c8,.c7,.c6,.c5,.c4,.c3{grid-column:span 12}.brief{grid-template-columns:minmax(0,1fr)}.brief .lead{border-right:0;border-bottom:1px solid var(--line)}}
@media (max-width:767px){
  #app,#app.rail-min{grid-template-columns:minmax(0,1fr)}
  nav.rail{display:none}
  header.top{padding:8px 16px;gap:8px;flex-wrap:wrap}
  .brandmark img{height:24px}
  .brandmark .prod{padding-left:9px}.brandmark .prod b{font-size:13px}
  .search{order:5;flex:1 1 100%}
  .user select{max-width:96px}
  .hide-sm{display:none!important}
  .fbar{padding:8px 16px;top:auto;position:static}
  .fsel{display:none}
  .mfilter{display:inline-flex;margin-left:auto}
  .content{padding:14px 16px calc(84px + env(safe-area-inset-bottom,0px))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .kpi-v{font-size:21px}
  .pagehead h1{font-size:20px}
  #bdmap{height:62vh;min-height:360px}
  .mini{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:minmax(0,1fr)}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--muted);padding:4px 0;position:relative}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button[aria-current="page"]{color:var(--brand-ink)}
  .tabbar .dot{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:9.5px;display:flex;align-items:center;justify-content:center;padding:0 3px}
  footer.demo{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .drawer{width:100%}
  table.t.cards thead{display:none}
  table.t.cards tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 10px;padding:8px 10px;border-bottom:1px solid var(--line)}
  table.t.cards td{border:0;padding:2px 0;white-space:normal;text-align:left!important}
  table.t.cards td::before{content:attr(data-l);display:block;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  table.t.cards td:first-child{grid-column:1/-1;font-weight:800}
  table.t.cards td:first-child::before{display:none}
}
</style>

      case 'open': openEntity(p[1], +p[2]); break;
      case 'kpi': openKPI(p[1]); break;
      case 'mapmetric': U.ST.mapMetric = SCR.MAP_METRICS.indexOf(p[1]) >= 0 ? p[1] : 'projGrad'; U.persist(); closeDrawer(); nav('map'); break;
      case 'fcmetric': U.ST.fcMetric = p[1]; closeDrawer(); nav('forecast'); break;
      case 'mapmode': U.ST.mapMode = p[1]; render(true); break;
      case 'dclose': closeDrawer(); break;
      case 'sclose': closeSheet(); break;
      case 'freset': F.cohort = 'all'; F.project = 'all'; F.asset = 'all'; F.period = 'm'; U.setPath(E.rootPath(F.role)); closeSheet(); render(true); break;
      case 'fsheet': sheet('<h3>' + t('filters') + '</h3>' + document.querySelector('.fsel').outerHTML.replace('class="fsel"', 'class="stack"') + '<button class="btn pri" data-act="sclose">' + t('close') + '</button>'); break;
      case 'more': sheet('<div class="navgrid">' + SCREENS.filter(function (s) { return ['overview', 'map', 'alerts', 'ask'].indexOf(s) < 0; }).map(function (s) { return '<button data-act="nav:' + s + '">' + U.ic(s) + t(s) + '</button>'; }).join('') + '</div><div class="row"><button class="btn" data-act="theme">' + U.ic('moon') + t('theme') + '</button><button class="btn" data-act="glossary">' + U.ic('help') + tt('Glossary', 'শব্দকোষ') + '</button></div>'); break;
      case 'sort': U.ST.peopleSort = p[1]; render(true); break;
      case 'alertev': var al = E.ALERTS().filter(function (x) { return x.id === p[1]; })[0]; if (!al) break; closeDrawer(); U.setPath(U.pathFor('br', al.b)) || U.setPath(E.rootPath(F.role)); U.ST.screen = al.screen; render(); if (al.po != null) openPO(al.po); else openBR(al.b); break;
      case 'alertst': var a2 = E.ALERTS().filter(function (x) { return x.id === p[1]; })[0]; a2.status = p[2]; saveAlert(a2); U.toast(p[2] === 'Resolved' ? t('resolved') : p[2] === 'Acknowledged' ? t('ack') : t('open')); render(true); break;
      case 'alertcm': var a3 = E.ALERTS().filter(function (x) { return x.id === p[1]; })[0]; var ta = document.getElementById('cm-' + p[1]); if (!ta || !ta.value.trim()) break; a3.comments.push({ by: E.ROLES[F.role].person, at: new Date().toISOString().slice(0, 16).replace('T', ' '), txt: ta.value.trim() }); saveAlert(a3); render(true); var det = document.querySelector('#' + p[1] + ' details'); if (det) det.open = true; break;
      case 'role': setRole(p[1]); break;
      case 'unmask': U.ST.unmasked[+p[1]] = 1; U.ST.piiLog = (U.ST.piiLog || []).concat([{ at: new Date().toISOString().slice(0, 16).replace('T', ' '), role: E.ROLES[F.role].en, hid: D.HH[+p[1]].hid }]); openHH(+p[1]); break;
      case 'askdrawer': openAskDrawer(); break;
      case 'asksug': ask(act.slice(7)); break;
      case 'asklink': var m = U.ST.asklog[+p[1]]; if (m && m.res.link) { closeDrawer(); var L2 = m.res.link; U.setPath(L2.path); if (L2.metric && L2.screen === 'map' && SCR.MAP_METRICS.indexOf(L2.metric) >= 0) U.ST.mapMetric = L2.metric; if (L2.screen === 'forecast') U.ST.fcMetric = L2.metric; if (L2.cohort) F.cohort = L2.cohort; if (L2.screen === 'people') U.ST.peopleSort = { visit: 'vc', syncLag: 'lag', unsynced: 'cash', caseload: 'cl', attend: 'at', geo: 'geo' }[L2.metric] || 'prr'; E.clearCache(); nav(L2.screen); } break;
      case 'askcopy': var m2 = U.ST.asklog[+p[1]]; if (m2) U.copyText(m2.res.rows && m2.res.rows.length ? [m2.res.cols.join('\t')].concat(m2.res.rows.map(function (r) { return (r.raw || r.cells.map(function (c) { return String(c).replace(/<[^>]+>/g, ' ').trim(); })).join('\t'); })).join('\n') : m2.res.html.replace(/<[^>]+>/g, '')); break;
      case 'assign': openAssign(+p[1]); break;
      case 'glossary': closeSheet(); openGlossary(); break;
      case 'trk': TRK.forEach(function (x) { if (x.id === p[1]) x.status = p[2]; }); saveTrk(); U.toast(p[2] === 'Done' ? tt('Marked done', 'সম্পন্ন') : tt('Reopened', 'পুনরায় খোলা')); render(true); break;
      case 'alertmore': U.ST.alertN = (U.ST.alertN || 25) + 25; render(true); break;
      case 'fch': U.ST.fcH = +p[1]; render(true); break;
      case 'sccyclone': U.ST.sc.disaster = D.districts.filter(function (d) { return ['Satkhira', 'Khulna', 'Bagerhat'].indexOf(d.name) >= 0; }).map(function (d) { return d.id; }); U.ST.sc.loss = 20; if (F.path.length && !E.branchesIn().some(function (b) { return U.ST.sc.disaster.indexOf(b.dist) >= 0; })) U.setPath(E.rootPath(F.role)); render(true); break;
      case 'scflood': U.ST.sc.disaster = Object.keys(E.branchesIn().reduce(function (o, b) { o[b.dist] = 1; return o; }, {})).map(Number); U.ST.sc.loss = 15; render(true); break;
      case 'screset': U.ST.sc = { pos: 0, goat: 0, stipend: 0, disaster: [], loss: 20, bkash: 0 }; render(true); break;
      case 'sccopy': var res = SCR.runScenario(U.ST.sc, E.cur()); var txt = tt('UPG scenario brief — ', 'ইউপিজি দৃশ্যকল্প ব্রিফ — ') + SCR.scopeName() + '\n' + t('basedOn') + '\n\n' + tt('Inputs: ', 'ইনপুট: ') + 'POs ' + U.ST.sc.pos + ', goats +' + U.ST.sc.goat + ' pts, stipend ' + U.ST.sc.stipend + '%, bKash +' + U.ST.sc.bkash + ' pts, disaster: ' + (U.ST.sc.disaster.map(function (d) { return D.districts[d].name; }).join(', ') || 'none') + ' (' + U.ST.sc.loss + '% asset loss)\n\n' + res.rows.map(function (r) { return tt(E.K[r.k].en, E.K[r.k].bn) + ': ' + fmtK(r.k, r.b) + ' → ' + fmtK(r.k, r.s); }).join('\n') + '\n\n' + res.summary.replace(/<[^>]+>/g, '') + '\n\nDEMO DATA — not real BRAC figures.'; U.copyText(txt); break;
      case 'report': U.ST.report = p[1]; render(true); break;
      case 'copytbl': var tb = document.querySelector('#' + p[1] + ' table'); if (tb) U.copyText(Array.prototype.map.call(tb.rows, function (r) { return Array.prototype.map.call(r.cells, function (c) { return c.innerText.replace(/\s+/g, ' ').trim(); }).join('\t'); }).join('\n')); break;
      case 'manifest': openManifest(+p[1], p.slice(2).join(':')); break;
      case 'settab': U.ST.setTab = p[1]; render(true); break;
      case 'setreset': E.resetSettings(); U.toast(t('saved')); break;
      case 'tour': tour(+p[1] || 0); break;
      case 'tourend': endTour(); break;
    }
  }
  function openEntity(kind, id) { if (kind === 'hh') { if (!U.allowedPath(U.pathFor('br', D.HH[id].b))) return U.toast(tt('Outside your data scope', 'আপনার পরিধির বাইরে')); openHH(id); } else if (kind === 'br') { if (!U.allowedPath(U.pathFor('br', id))) return U.toast(tt('Outside your data scope', 'আপনার পরিধির বাইরে')); openBR(id); } else if (kind === 'po') openPO(id); else if (kind === 'vo') openVO(id); }
  function saveAlert(a) { E.ALERT_STATE[a.id] = { status: a.status, owner: a.owner, due: a.due, comments: a.comments }; E.saveAlerts(); }
  function setRole(r) { F.role = r; U.ST.unmasked = {}; F.path = E.rootPath(r); E.clearCache(); render(); U.toast(tt(E.ROLES[r].en, E.ROLES[r].bn)); }
  function ask(q) {
    if (!q || !q.trim()) return;
    var res = ASK.answer(q); if (!res) return;
    U.ST.asklog.push({ role: 'q', text: q.trim() }); U.ST.asklog.push({ role: 'a', res: res, q: q.trim() });
    U.persist();
    if (DRAWER.kind === 'ask') openAskDrawer(); else render(true);
    setTimeout(function () { var ms = document.querySelectorAll(DRAWER.kind === 'ask' ? '#drawer .msg' : '#content .msg'); if (ms.length) ms[ms.length - 1].scrollIntoView({ block: 'nearest' }); var inp = document.getElementById(DRAWER.kind === 'ask' ? 'askqd' : 'askq'); if (inp) inp.focus(); }, 80);
  }
  function onChange(e) {
    var el = e.target.closest('[data-chg]'); if (!el) return;
    var k = el.getAttribute('data-chg'), v = el.type === 'checkbox' ? el.checked : el.value, p = k.split(':');
    if (p[0] === 'f') { F[p[1]] = v; E.clearCache(); closeSheet(); render(true); return; }
    if (k === 'role') return setRole(v);
    if (k === 'mapMetric') { U.ST.mapMetric = v; U.persist(); render(true); return; }
    if (k === 'compare') { U.ST.compare = v || null; render(true); return; }
    if (k === 'fcMetric') { U.ST.fcMetric = v; render(true); return; }
    if (p[0] === 'alertF.sev' || k.indexOf('alertF.') === 0) { U.ST.alertF[k.split('.')[1]] = v; render(true); return; }
    if (p[0] === 'alertown') { var a = E.ALERTS().filter(function (x) { return x.id === p[1]; })[0]; a.owner = v; saveAlert(a); U.toast(tt('Assigned to ', 'দায়িত্ব: ') + v); return; }
    if (p[0] === 'alertdue') { var a2 = E.ALERTS().filter(function (x) { return x.id === p[1]; })[0]; a2.due = v; saveAlert(a2); U.toast(t('saved')); return; }
    if (p[0] === 'sc') { U.ST.sc[p[1]] = +v; render(true); return; }
    if (p[0] === 'scd') { var id = +p[1], arr = U.ST.sc.disaster; if (v && arr.indexOf(id) < 0) arr.push(id); if (!v) U.ST.sc.disaster = arr.filter(function (x) { return x !== id; }); render(true); return; }
    if ((p[0] === 'mand' || p[0] === 'set') && !APP.canEdit()) { U.toast(tt('View only for your role', 'আপনার ভূমিকায় শুধু দেখা যাবে')); render(true); return; }
    if (p[0] === 'mand') { E.SET.mandatory[p[1]] = v; E.saveSettings(); return; }
    if (p[0] === 'set') { var path = p[1].split('.'), o = E.SET; for (var i = 0; i < path.length - 1; i++) o = o[path[i]]; var num = +v; if (isNaN(num)) return; o[path[path.length - 1]] = num; E.saveSettings(); return; }
  }
  function onInput(e) { if (e.target.id === 'q') search(e.target.value); }
  function onSubmit(e) {
    var f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
    if (f.getAttribute('data-form') === 'ask') { var inp = f.querySelector('input'); var q = inp.value; inp.value = ''; ask(q); }
    if (f.getAttribute('data-form') === 'assign') { var x = E.actions()[+f.getAttribute('data-i')]; if (x) { var k = actKey(x); TRK = TRK.filter(function (y) { return !(y.key === k && y.status !== 'Done'); }); var rec = { id: 'AC-' + (1000 + TRK.length) + '-' + Date.now() % 10000, key: k, en: x.en, bn: x.bn, b: x.b, dist: x.dist != null ? x.dist : (x.b != null ? D.branches[x.b].dist : null), owner: document.getElementById('as-owner').value, due: document.getElementById('as-due').value, note: document.getElementById('as-note').value.trim(), status: 'Open', by: E.ROLES[F.role].person }; TRK.push(rec); saveTrk(); closeDrawer(); U.toast(tt('Assigned to ', 'দায়িত্ব: ') + rec.owner); render(true); } }
    if (f.getAttribute('data-form') === 'sched') { try { localStorage.setItem('upg.sched', JSON.stringify({ freq: document.getElementById('sc-freq').value, to: document.getElementById('sc-to').value })); } catch (er) { } U.toast(tt('Schedule saved (demo — no email is sent)', 'সংরক্ষিত (ডেমো — ইমেইল যায় না)')); render(true); }
  }
  function onKey(e) {
    if (e.key === 'Escape') { if (document.getElementById('tourbox')) endTour(); else if (document.getElementById('sheet')) closeSheet(); else if (document.getElementById('drawer')) closeDrawer(); else { var qr = document.getElementById('qres'); if (qr) qr.hidden = true; } }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-act]')) { e.preventDefault(); e.target.click(); }
  }

  function boot() {
    app = document.getElementById('app');
    document.documentElement.setAttribute('data-theme', U.ST.theme === 'dark' ? 'dark' : 'light');
    E.onRecompute = function () { E.buildAlerts(); if (app && app.innerHTML) render(true); };
    E.recompute();
    var h = (location.hash || '').slice(1); if (SCREENS.indexOf(h) >= 0) U.ST.screen = h;
    document.addEventListener('click', onClick); document.addEventListener('change', onChange); document.addEventListener('input', onInput); document.addEventListener('submit', onSubmit); document.addEventListener('keydown', onKey);
    window.addEventListener('hashchange', function () { var s = location.hash.slice(1); if (SCREENS.indexOf(s) >= 0 && s !== U.ST.screen) nav(s); });
    var obs = new MutationObserver(function () { var th = document.documentElement.getAttribute('data-theme'); if (th !== lastTheme) { lastTheme = th; if (app.innerHTML) render(true); } }); var lastTheme = document.documentElement.getAttribute('data-theme'); obs.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    app.hidden = false; render();
    var bt = document.getElementById('boot'); if (bt) bt.remove();
    if (!U.ST.toured && !/[?&]notour/.test(location.search) && window.innerWidth > 0) setTimeout(function () { tour(0); }, 700);
  }
  return { boot: boot, render: render, nav: nav, drillTo: drillTo, openHH: openHH, openPO: openPO, openBR: openBR, tracked: tracked, trackList: trackList, canAssign: canAssign, canEdit: function () { return F.role === 'director' || F.role === 'head' || F.role === 'me'; } };
})();
setTimeout(function () { try { APP.boot(); } catch (e) { console.error(e); var b = document.getElementById('boot'); if (b) b.innerHTML = '<b>Could not start the dashboard.</b><div>' + String(e && e.message) + '</div>'; } }, 30);


}
